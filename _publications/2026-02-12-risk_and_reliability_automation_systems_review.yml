title: "Risk and reliability evaluation of future industrial automation systems: a systematic literature review and research agenda"
authors: "Andrey Morozov, Tagir Fabarisov, Silvia Vock, Georg Siedel, Victor Bolbot, Stefan Voß"
date: "2026-02-12"
journal: "ASCE-ASME Journal of Risk and Uncertainty in Engineering Systems, Part B: Mechanical Engineering, Volume 12, Issue 2: 020801"
description: "Current industrial risk analysis methods lag behind the rising technical sophistication of modern Cyber-Physical Production Systems. It remains unclear whether existing methods can capture complex failure scenarios of dynamic, AI-driven systems with advanced software architectures. This paper presents the main challenges faced by safety engineers in industrial automation and provides a structured classification of risk and reliability analysis methods and metrics, supported by a systematic review of 95 papers up to October 2025. The review addresses questions such as: which CPPS aspects must be considered, which methods are applicable, what are their advantages and limitations, and how can methods be combined? The findings reveal the need to extend classical approaches toward dynamic risk assessment, probabilistic model checking, AI-based techniques, digital twins, and intelligent fault injection. The study provides both a comprehensive overview of current risk and reliability assessment methods for CPPS and a roadmap for advancing their future development."
